[package]
name = "mod-simplylight"
version = "0.3.8"
edition = "2024"
license = "MIT"
description = "Simply Light for Sunrise: 160 light blocks, and the illuminant blocks' redstone switch"
# Ported from: Simply Light 1.5.3+1.21.1-b4 (Flanks255/simplylight, MIT), Minecraft Java 1.21.1
# NeoForge. The textures, models, blockstates, lang and recipes are the upstream mod's own MIT
# files, upgraded to 26.3; the declarations in data/simplylight/sunrise/block/ are generated from
# the behaviour read in the upstream source.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
